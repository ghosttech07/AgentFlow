[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Live tests call real Gemini (costs money); run them explicitly with: pytest -m live
markers =
    live: calls a real model API (excluded by default; run with -m live or a provider marker)
    live_gemini: real Gemini call (needs GEMINI_API_KEY; ~20 free calls/day)
    live_anthropic: real Anthropic call (needs ANTHROPIC_API_KEY)
    live_openai: real OpenAI call (needs OPENAI_API_KEY)
    live_ollama: real local Ollama call (needs Ollama running; free)
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning:asyncpg.*
