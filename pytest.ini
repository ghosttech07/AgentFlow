[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Live tests call real Gemini (costs money); run them explicitly with: pytest -m live
markers =
    live: calls the real Gemini API (needs GEMINI_API_KEY)
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning:asyncpg.*
