name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action scans only the pushed commits; this scans every commit (fixtures allowlisted in .gitleaksignore).
      - name: Full-history scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --log-opts=--all --redact --no-banner

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.8,<1"
      - run: ruff check .

  tests:
    name: Tests (Python 3.11, Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: agentflow
          POSTGRES_DB: agentflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentflow -d agentflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://agentflow:agentflow@localhost:5432/agentflow
      TEST_DATABASE_URL: postgresql+asyncpg://agentflow:agentflow@localhost:5432/agentflow_test
      SAMPLE_DATA_URL: postgresql+asyncpg://agentflow_reader:reader@localhost:5432/agentflow_sample
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create the test database
        run: PGPASSWORD=agentflow psql -h localhost -U agentflow -d agentflow -c "CREATE DATABASE agentflow_test"
      - run: python scripts/setup_sample_data.py
      - run: alembic upgrade head
      - name: Tests (fake LLM, no network)
        run: pytest -q
      - name: Annotate failed tests
        if: failure()
        run: python scripts/ci/junit_annotations.py
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: reports/*.xml
