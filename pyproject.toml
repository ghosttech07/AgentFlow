[project]
name = "agentflow"
version = "2.0.0"
description = "A self-hosted engine for trustworthy AI workflows."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import order, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the framework's documented pattern
    "E501",  # long lines: readability is reviewed by hand; no formatter is enforced
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "scripts"]
