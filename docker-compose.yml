# Part 1: only PostgreSQL runs in Docker. The FastAPI app runs locally via uvicorn.
services:
  postgres:
    image: postgres:16
    container_name: agentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports:
      - "5432:5432"
    volumes:
      # Named volume so data survives container restarts / recreation.
      - agentflow_pgdata:/var/lib/postgresql/data
      # Init scripts run ONLY on first start with an empty data volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  agentflow_pgdata:
