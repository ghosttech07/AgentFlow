# AgentFlow model routes (Part 8). Copy ONE profile below to config/models.yaml (or point
# MODELS_CONFIG_PATH at your file). No models.yaml = the legacy Gemini-only routes built from
# GEMINI_MODEL / GEMINI_FALLBACK_MODELS / GEMINI_WORKER_MODEL (exactly the v1 behaviour).
#
# Entries are "provider:model" and are tried IN ORDER. The router falls back to the next entry on
# overload (503/529), quota exhausted, model not found and timeouts; never on bad output or bad keys.
# Roles: planner, researcher, analyst, writer, reviewer, ask (Quick Ask); others use `default`.
# An entry whose provider is not configured (no key / Ollama not running) is skipped with a warning.
#
# Models below marked VERIFIED were listed by scripts/list_provider_models.py on 2026-11-26 for this
# machine and key (Gemini free key + local Ollama with llama3.2:3b and qwen3:4b). Entries marked
# PLACEHOLDER are examples for providers without a key here: run the script after adding a key and
# replace them with models your account actually lists.

# ---------------------------------------------------------------------------------------------
# (a) gemini-only: what v1 does today (VERIFIED). Free tier: ~20 req/day on gemini-3.5-flash.
# ---------------------------------------------------------------------------------------------
# routes:
#   default:    ["gemini:gemini-3.5-flash", "gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite"]
#   researcher: ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "gemini:gemini-3.5-flash"]
#   analyst:    ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "gemini:gemini-3.5-flash"]
#   writer:     ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "gemini:gemini-3.5-flash"]
#   reviewer:   ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "gemini:gemini-3.5-flash"]
#   ask:        ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "gemini:gemini-3.5-flash"]
# quotas:
#   "gemini:gemini-3.5-flash": {requests_per_day: 20, timezone: America/Los_Angeles}  # Google resets at midnight Pacific

# ---------------------------------------------------------------------------------------------
# (b) free dev: local Ollama first (no quota, $0), Gemini only as a fallback (VERIFIED).
#     llama3.2:3b answers in ~5-10 s on a 6 GB laptop GPU; qwen3:4b reasons better but
#     "thinks" for 1-2 minutes per call, so it is listed second.
# ---------------------------------------------------------------------------------------------
# routes:
#   default: ["ollama:llama3.2:3b", "ollama:qwen3:4b", "gemini:gemini-3.5-flash-lite"]
#   # Live-tested 2026-11-26: llama3.2:3b produced invalid plans (too many tasks) three times in a
#   # row, and an invalid plan is not a provider error, so it never falls back. qwen3:4b plans
#   # correctly (slowly). Prefer Gemini for planning whenever you have quota.
#   planner: ["ollama:qwen3:4b", "gemini:gemini-3.5-flash"]
# quotas:
#   "gemini:gemini-3.5-flash": {requests_per_day: 20, timezone: America/Los_Angeles}

# ---------------------------------------------------------------------------------------------
# (c) best quality: a strong model plans and reviews, a cheap fast one researches and writes,
#     across providers. Anthropic/OpenAI lines are PLACEHOLDERS (no key on this machine):
#     replace them with models from `python scripts/list_provider_models.py` once keys are set.
# ---------------------------------------------------------------------------------------------
# routes:
#   default:    ["gemini:gemini-3.5-flash-lite", "ollama:llama3.2:3b"]
#   planner:    ["anthropic:claude-opus-5-5", "gemini:gemini-3.5-flash"]        # PLACEHOLDER first entry
#   reviewer:   ["anthropic:claude-sonnet-5-5", "gemini:gemini-3.5-flash"]      # PLACEHOLDER first entry
#   researcher: ["gemini:gemini-3.5-flash-lite", "openai:<your-fast-model>"]    # PLACEHOLDER second entry
#   writer:     ["anthropic:claude-haiku-5-5", "gemini:gemini-3.5-flash-lite"]  # PLACEHOLDER first entry
# quotas:
#   "gemini:gemini-3.5-flash": {requests_per_day: 20, timezone: America/Los_Angeles}

# ---------------------------------------------------------------------------------------------
# Recommended for THIS machine (Gemini free key + local Ollama) - active profile is in
# config/models.yaml if you created it: Gemini plans (quality), the fast lite model works, Ollama
# catches overloads and exhausted quota for $0.
# ---------------------------------------------------------------------------------------------
routes:
  default: ["gemini:gemini-3.5-flash-lite", "gemini:gemini-3.1-flash-lite", "ollama:llama3.2:3b"]
  planner: ["gemini:gemini-3.5-flash", "gemini:gemini-3.5-flash-lite", "ollama:llama3.2:3b"]
  ask:     ["gemini:gemini-3.5-flash-lite", "ollama:llama3.2:3b"]
quotas:
  "gemini:gemini-3.5-flash": {requests_per_day: 20, timezone: America/Los_Angeles}
