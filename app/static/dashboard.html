<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow</title>
<meta name="color-scheme" content="light dark">
<style>
@font-face { font-family: "Libre Franklin"; src: url("/static/fonts/LibreFranklin-Variable.ttf") format("truetype");
  font-weight: 100 900; font-display: swap; }

:root {
  --bg: #f7f7f5; --side: #efefec; --surface: #ffffff; --raised: #ffffff;
  --ink: #1b1c1e; --ink-2: #4f5258; --ink-3: #5c6067; --line: #e2e2de; --line-2: #d3d3ce;
  --accent: #0d6b5f; --accent-ink: #ffffff; --accent-soft: #e3f1ee; --accent-text: #0b5c52;
  --ok: #1d7a45; --warn: #9a5b00; --bad: #b42318; --warn-soft: #fff4e0; --bad-soft: #fdecea;
  --shadow: 0 1px 2px rgb(16 18 20 / .06), 0 8px 24px -12px rgb(16 18 20 / .14);
  --radius: 14px; --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --brand: "Libre Franklin", var(--sans); --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517; --side: #1b1c1f; --surface: #1f2023; --raised: #26272b;
    --ink: #ececea; --ink-2: #b3b4b8; --ink-3: #9a9ba1; --line: #2d2e33; --line-2: #3a3b41;
    --accent: #4fc2ad; --accent-ink: #0b1f1b; --accent-soft: #17302b; --accent-text: #7fd6c5;
    --ok: #5cc98a; --warn: #f0b35a; --bad: #f2867a; --warn-soft: #2e2416; --bad-soft: #33201e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--ink); }
a { color: var(--accent-text); text-underline-offset: 3px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- shell */
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100vh; }
aside.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; justify-content: space-between; padding: 22px 18px 14px; }
.wordmark { font-family: var(--brand); font-weight: 800; font-size: 28px; letter-spacing: -0.03em; margin: 0; line-height: 1; }
.newbtn { display: flex; align-items: center; gap: 8px; margin: 0 14px 14px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; }
.newbtn:hover { border-color: var(--accent); }
.histhead { padding: 8px 18px 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
#history { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.hitem { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 9px 10px; border: 0;
  background: none; border-radius: 9px; cursor: pointer; color: var(--ink); }
.hitem:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.hitem[aria-current="true"] { background: var(--accent-soft); }
.hitem .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; line-height: 1.35; }
.hitem .m { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.hitem svg.i { width: 16px; height: 16px; margin-top: 2px; color: var(--ink-3); }
.hempty { padding: 10px 12px; color: var(--ink-3); font-size: 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.dot.run { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.dot.wait { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.ok { background: var(--ok); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } * { transition: none !important; } }
details.settings { border-top: 1px solid var(--line); padding: 10px 14px 14px; font-size: 14px; }
details.settings summary { cursor: pointer; display: flex; gap: 8px; align-items: center; color: var(--ink-2); list-style: none; padding: 4px; }
details.settings summary::-webkit-details-marker { display: none; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.field input, .field textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); }
.hint { font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }

main { overflow-y: auto; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.col { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 24px; }

/* ---------------------------------------------------------------- home + composer */
.home { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 14vh; }
.home .dock { margin-top: 0; padding-top: 0; background: none; }
.home h2 { font-family: var(--brand); font-weight: 800; font-size: 56px; letter-spacing: -0.035em; text-align: center; margin: 0 0 28px; line-height: 1; }
.composer { background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, var(--line-2)); }
.composer textarea { width: 100%; border: 0; background: none; resize: none; outline: none; font-size: 17px; line-height: 1.5; min-height: 52px; max-height: 240px; padding: 4px 0; }
.composer textarea::placeholder { color: var(--ink-3); }
.crow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.modes { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.modes button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.spacer { flex: 1; }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); }
.iconbtn:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.send { background: var(--accent); color: var(--accent-ink); }
.send:hover { background: color-mix(in srgb, var(--accent) 88%, black); color: var(--accent-ink); }
.send:disabled { opacity: .45; cursor: default; }
.modehint { text-align: center; font-size: 13px; color: var(--ink-3); margin: 12px 0 0; min-height: 20px; }
.dock { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 18px 0 18px; margin-top: auto; }

/* ---------------------------------------------------------------- answer */
.view { padding: 36px 0 8px; }
.q { font-family: var(--brand); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 18px; text-wrap: balance; }
.srcrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 0 0 22px; }
.src { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 13px; line-height: 1.35; }
.src:hover { border-color: var(--line-2); background: var(--raised); }
.src b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
.src span { color: var(--ink-3); font-size: 12px; display: flex; gap: 6px; margin-top: 4px; }
.src .n { color: var(--accent-text); font-weight: 700; }
.src.uncited { opacity: .7; }
.prose { font-size: 16.5px; line-height: 1.7; max-width: 70ch; }
.prose p { margin: 0 0 14px; } .prose ul { padding-left: 22px; margin: 0 0 14px; } .prose li { margin: 4px 0; }
.prose h3, .prose h4 { font-size: 18px; margin: 22px 0 8px; } .prose h2 { font-size: 21px; margin: 26px 0 10px; }
a.cite { font-size: 12px; font-weight: 700; text-decoration: none; background: var(--accent-soft); color: var(--accent-text); border-radius: 6px; padding: 0 5px; margin: 0 1px; vertical-align: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-3); margin: 6px 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.chips button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; text-align: left; }
.chips button:hover { border-color: var(--accent); color: var(--accent-text); }
.sub { font-size: 14px; font-weight: 700; color: var(--ink-2); margin: 22px 0 10px; }
.note { border-radius: 10px; padding: 10px 14px; font-size: 14px; margin: 0 0 16px; }
.note.warn { background: var(--warn-soft); color: var(--warn); } .note.bad { background: var(--bad-soft); color: var(--bad); }
.skel { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--line) 0%, var(--raised) 50%, var(--line) 100%); background-size: 200% 100%; animation: sh 1.3s linear infinite; margin: 10px 0; }
@keyframes sh { to { background-position: -200% 0; } }
.status-line { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; margin-bottom: 8px; }

/* ---------------------------------------------------------------- research */
.rhead { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 20px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.steps { list-style: none; margin: 14px 0 22px; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.steps li { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 14.5px; }
.steps li:first-child { border-top: 0; }
.steps .who { color: var(--ink-3); font-size: 13px; margin-left: auto; text-align: right; }
.steps .err { color: var(--bad); font-size: 13px; display: block; }
.steps li { flex-wrap: wrap; }
.tools { list-style: none; margin: 6px 0 0 19px; padding: 0; width: 100%; font-size: 13px; color: var(--ink-2); }
.tools li { border: 0; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tools .tn { font-weight: 600; color: var(--ink); }
.tools .ta { color: var(--ink-3); overflow-wrap: anywhere; }
.badge { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.badge.ok { color: var(--ok); }
.ask-card { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--surface); border-radius: var(--radius); padding: 16px 18px; margin: 0 0 18px; box-shadow: var(--shadow); }
.ask-card h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.ask-card p { margin: 0 0 8px; color: var(--ink-2); font-size: 14px; }
.ask-card pre, details pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.ask-card .warnings { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin: 8px 0; }
details.more { border-top: 1px solid var(--line); padding: 12px 0; }
details.more summary { cursor: pointer; font-weight: 600; color: var(--ink-2); font-size: 14px; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.kv div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--ink-3); }
.kv b { display: block; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.log { list-style: none; padding: 0; margin: 10px 0 0; font-size: 13.5px; max-height: 320px; overflow: auto; }
.log li { display: flex; gap: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
.log time { color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 56px; }
.gantt { display: grid; gap: 6px; margin: 10px 0 4px; }
.gantt .row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr; gap: 10px; align-items: center; font-size: 13px; }
.gantt .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.gantt .track { position: relative; height: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.gantt .seg { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: var(--ok); min-width: 3px; }
.gantt .seg.failed, .gantt .seg.worker_lost, .gantt .seg.cancelled { background: var(--bad); }
.gantt .seg.interrupted, .gantt .seg.budget_paused, .gantt .seg.suspended { background: var(--warn); }
.gantt .seg.running { background: var(--accent); }
.gantt .mk { position: absolute; top: -3px; width: 2px; height: 20px; background: var(--ink); opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 26px; margin: 0 0 18px; }
.report h2.title { font-family: var(--brand); font-size: 24px; letter-spacing: -0.02em; margin: 0 0 12px; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow);
  transition: opacity .2s ease-out, transform .25s cubic-bezier(.2, .8, .2, 1); max-width: min(520px, 90vw); z-index: 20; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.bad { background: var(--bad); color: #fff; }

@media (pointer: coarse) {
  .iconbtn { width: 44px; height: 44px; }
  .modes button, .btn, .chips button, .newbtn { min-height: 44px; }
  .hitem { min-height: 48px; }
}
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 15; transform: translateX(-102%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); box-shadow: var(--shadow); }
  body.menu aside.side { transform: none; }
  body.menu .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 14; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .topbar .wordmark { font-size: 22px; }
  .home h2 { font-size: 42px; }
  .col { padding: 0 16px; }
  .q { font-size: 23px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>

<div class="app">
  <aside class="side" id="side" aria-label="History">
    <div class="brand"><h1 class="wordmark">AgentFlow</h1></div>
    <button class="newbtn" id="newbtn" type="button"><svg class="i"><use href="#i-plus"/></svg>New question</button>
    <button class="newbtn" id="memorybtn" type="button" style="margin-top:-6px"><svg class="i"><use href="#i-doc"/></svg>Memory</button>
    <div class="histhead" id="histlabel">History</div>
    <nav id="history" aria-labelledby="histlabel"></nav>
    <details class="settings">
      <summary><svg class="i"><use href="#i-gear"/></svg>Settings</summary>
      <label class="field">Your name (shown on approvals)<input id="actor" autocomplete="name" placeholder="admin"></label>
      <label class="field">Your access key (optional)<input id="apikey" type="password" autocomplete="off"></label>
      <p class="hint">Your personal key from your admin (or the server's ADMIN_API_KEY). Leave empty on a local server with no users. This is not an AI key: AI keys stay in the server's .env file. Kept in this browser only.</p>
      <p class="hint" id="whoami" aria-live="polite"></p>
    </details>
  </aside>

  <main id="main">
    <div class="topbar"><button class="iconbtn" id="menubtn" type="button" aria-label="Open history" aria-controls="side" aria-expanded="false"><svg class="i"><use href="#i-menu"/></svg></button>
      <span class="wordmark">AgentFlow</span></div>
    <div id="content" class="col"></div>
    <div class="dock col" id="dock">
      <form class="composer" id="composer">
        <label for="question" class="sr">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask anything…" maxlength="1000"></textarea>
        <div class="crow">
          <div class="modes" role="group" aria-label="Answer type">
            <button type="button" data-mode="quick" aria-pressed="true">Quick answer</button>
            <button type="button" data-mode="deep" aria-pressed="false">Deep research</button>
          </div>
          <span class="spacer"></span>
          <button type="button" class="iconbtn" id="micbtn" aria-label="Ask by voice (coming soon)" title="Voice (coming soon)"><svg class="i"><use href="#i-mic"/></svg></button>
          <button type="submit" class="iconbtn send" id="sendbtn" aria-label="Ask"><svg class="i"><use href="#i-up"/></svg></button>
        </div>
      </form>
      <p class="modehint" id="modehint"></p>
    </div>
  </main>
</div>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="announcer" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Links from search results are untrusted: only http(s) may become a clickable href (no javascript: etc.).
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return String(u || "").slice(0, 60); } }
function safeUrl(u) { return /^https?:\/\//i.test(String(u || "")) ? String(u) : "#"; }
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const MODE_HINT = {
  quick: "A short answer in seconds, with the web pages it came from.",
  deep: "A team of agents plans, researches and writes a full report. You can follow each step and approve sensitive ones.",
};
let mode = store.get("af.mode") === "deep" ? "deep" : "quick";
let route = null;          // {kind: "home"} | {kind: "q", id} | {kind: "r", id}
let pending = null;        // question being answered right now
let busy = false, poll = null;

for (const id of ["apikey", "actor"]) { $(id).value = store.get("af." + id); $(id).addEventListener("change", () => store.set("af." + id, $(id).value)); }
async function whoami() {  /* Part 11: show who the key belongs to; a signed-in user's name is used on approvals */
  try {
    const me = await api("GET", "/me");
    $("whoami").textContent = me.kind === "user" ? `Signed in as ${me.name} (${me.role}${me.team ? ", team " + me.team : ""})`
      : me.kind === "admin_key" ? "Signed in with the admin key (all teams)" : "Local mode: no sign-in needed";
    if (me.kind === "user") { $("actor").value = me.name; $("actor").disabled = true; } else { $("actor").disabled = false; }
  } catch (e) { $("whoami").textContent = e.message; }
}
$("apikey").addEventListener("change", whoami);
whoami();
const actor = () => $("actor").value.trim() || "admin";

function toast(msg, bad = false) {
  const t = $("toast");
  t.textContent = msg; t.className = "on" + (bad ? " bad" : "");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.className = bad ? "bad" : ""), 4200);
}
const announce = (m) => { $("announcer").textContent = m; };

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if ($("apikey").value) headers["X-API-Key"] = $("apikey").value;
  const resp = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = resp.status === 204 ? null : await resp.json().catch(() => null);
  if (!resp.ok) {
    if (resp.status === 401) throw new Error("This needs your access key (Settings, bottom left).");
    if (resp.status === 403) throw new Error((data && data.error && data.error.message) || "Your role cannot do this.");
    throw new Error((data && data.error && data.error.message) || `Request failed (${resp.status})`);
  }
  return data;
}

/* ---------------------------------------------------------------- text helpers */
function cite(html, sources) {
  const byN = Object.fromEntries((sources || []).map((s) => [s.n, s]));
  return html.replace(/\[(\d{1,2}(?:\s*[,;]\s*\d{1,2})*)\]/g, (m, group) => group.split(/[,;]/).map((n) => {
    const s = byN[Number(n)];
    return s ? `<a class="cite" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer" title="${esc(s.title)}">${Number(n)}</a>` : `[${esc(n.trim())}]`;
  }).join(""));
}
/* Minimal, safe Markdown: everything is escaped first; only headings, lists, bold and paragraphs are rebuilt. */
function md(text, sources) {
  const lines = esc(text || "").split(/\r?\n/);
  let out = "", list = false;
  const inline = (s) => cite(s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"), sources);
  for (const raw of lines) {
    const line = raw.trim();
    const item = line.match(/^[-*•]\s+(.*)/) || line.match(/^\d+[.)]\s+(.*)/);
    if (item) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(item[1])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { const lvl = Math.min(4, h[1].length + 1); out += `<h${lvl}>${inline(h[2])}</h${lvl}>`; continue; }
    if (line.startsWith("|") && line.endsWith("|")) { out += `<p>${inline(line.replace(/\|/g, " · ").replace(/^ · | · $/g, ""))}</p>`; continue; }
    if (line) out += `<p>${inline(line)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}
function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
const STATUS = {
  PENDING: ["Starting", "run"], PLANNING: ["Planning", "run"], RUNNING: ["Working", "run"], PAUSED: ["Paused", "wait"],
  AWAITING_APPROVAL: ["Needs your approval", "wait"], COMPLETED: ["Done", "ok"], FAILED: ["Failed", "bad"], CANCELLED: ["Cancelled", ""],
  REPLANNING: ["Re-planning", "run"],
  answered: ["Answered", "ok"], failed: ["Failed", "bad"],
};
const TASK_STATUS = {
  PENDING: "Waiting", READY: "Up next", RUNNING: "Working…", RETRYING: "Retrying", AWAITING_APPROVAL: "Needs your approval",
  SUCCEEDED: "Done", FAILED: "Failed", CANCELLED: "Cancelled", SKIPPED: "Skipped", SUPERSEDED: "Replaced",
};
const SKIP = { condition_false: "its condition was false", upstream_skipped: "an earlier step was skipped",
  no_dependency_succeeded: "no earlier step succeeded" };
const AGENT = { researcher: "Researcher", analyst: "Analyst", writer: "Writer", reviewer: "Reviewer", publisher: "Publisher", communicator: "Communicator" };
const pill = (s) => { const [label, cls] = STATUS[s] || [s, ""]; return `<span class="pill"><span class="dot ${cls}"></span>${esc(label)}</span>`; };

/* ---------------------------------------------------------------- composer */
function setMode(m) {
  mode = m; store.set("af.mode", m);
  document.querySelectorAll(".modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  $("question").placeholder = m === "deep" ? "What should the agents research? e.g. EV adoption in India in 2026" : "Ask anything…";
  $("modehint").textContent = MODE_HINT[m];
}
document.querySelector(".modes").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
$("micbtn").onclick = () => toast("Voice input isn't available yet. It's coming in a future update.");
const grow = () => { const t = $("question"); t.style.height = "auto"; t.style.height = Math.min(240, t.scrollHeight) + "px"; };
$("question").addEventListener("input", grow);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
$("composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("question").value.trim();
  if (text.length < 3) return toast("Type a question first.", true);
  if (busy) return;
  $("question").value = ""; grow();
  if (mode === "quick") return askQuestion(text);
  busy = true; $("sendbtn").disabled = true;
  try {
    const wf = await api("POST", "/workflows", { name: text.slice(0, 80), goal: text, run: true });
    go({ kind: "r", id: wf.id });
    loadHistory();
  } catch (err) { toast(err.message, true); $("question").value = text; }
  finally { busy = false; $("sendbtn").disabled = false; }
};

/* ---------------------------------------------------------------- routing */
function go(r, push = true) {
  route = r; clearInterval(poll);
  const hash = r.kind === "home" ? "" : r.kind === "memory" ? "#memory" : `#${r.kind}/${r.id}`;
  if (push && location.hash !== hash) history.pushState(null, "", hash || location.pathname);
  document.body.classList.remove("menu");
  markCurrent(); render();
}
function parseHash() {
  if (location.hash === "#memory") return { kind: "memory", id: "memory" };
  const m = location.hash.match(/^#(q|r)\/([0-9a-f-]{36})$/);
  return m ? { kind: m[1], id: m[2] } : { kind: "home" };
}
$("memorybtn").onclick = () => go({ kind: "memory", id: "memory" });
async function showMemory(q = "") {
  let items = [];
  try { items = (await api("GET", `/memories?q=${encodeURIComponent(q)}&limit=100`)).items; }
  catch (err) { $("content").innerHTML = `<div class="view"><div class="note bad">${esc(err.message)}</div></div>`; return; }
  $("content").innerHTML = `<div class="view"><h2 class="q">Memory</h2>
    <p class="hint">Facts and lessons AgentFlow kept from earlier research (verified sources only). They are reused, with their date, when a new question is similar.</p>
    <form id="memsearch" class="actions"><input class="field" name="q" value="${esc(q)}" placeholder="Search memory" style="flex:1;padding:8px 10px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface)"><button class="btn" type="submit">Search</button></form>
    <ol class="steps">${items.map((m) => `<li><span>${esc(m.content)}<span class="hint" style="display:block">${esc(m.kind)} · ${esc(new Date(m.created_at).toLocaleDateString())}${m.confidence ? " · confidence " + esc(m.confidence) : ""}${m.tainted ? " · from web content" : ""}${m.private ? " · private" : ""}${(m.sources || []).length ? " · " + m.sources.slice(0, 2).map((s) => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">${esc(hostOf(s.url))}</a>`).join(", ") : ""}</span></span>
      <span class="who"><button class="btn" data-mem-pin="${esc(m.id)}" data-pinned="${m.pinned}">${m.pinned ? "Unpin" : "Pin"}</button> <button class="btn danger" data-mem-del="${esc(m.id)}">Delete</button></span></li>`).join("") || `<li>Nothing stored yet. Research results with verified sources appear here.</li>`}</ol></div>`;
}
$("content").addEventListener("submit", (e) => { if (e.target.id === "memsearch") { e.preventDefault(); showMemory(e.target.elements.q.value); } });
$("content").addEventListener("click", async (e) => {
  const pin = e.target.closest("[data-mem-pin]"), del = e.target.closest("[data-mem-del]");
  try {
    if (pin) { await api("POST", `/memories/${pin.dataset.memPin}/pin?pinned=${pin.dataset.pinned !== "true"}`); showMemory(); }
    if (del && confirm("Delete this memory? It will not be reused.")) { await api("DELETE", `/memories/${del.dataset.memDel}`); showMemory(); }
  } catch (err) { toast(err.message, true); }
});
window.addEventListener("popstate", () => go(parseHash(), false));
$("newbtn").onclick = () => { go({ kind: "home" }); $("question").focus(); };
function setMenu(open) {
  document.body.classList.toggle("menu", open);
  $("menubtn").setAttribute("aria-expanded", String(open));
  if (open) $("newbtn").focus(); else if (document.activeElement && $("side").contains(document.activeElement)) $("menubtn").focus();
}
$("menubtn").onclick = () => setMenu(!document.body.classList.contains("menu"));
$("scrim").onclick = () => setMenu(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("menu")) setMenu(false); });

function render() {
  $("content").classList.toggle("home", route.kind === "home");
  if (route.kind === "home") { $("content").innerHTML = `<h2>AgentFlow</h2>`; $("content").appendChild($("dock")); $("dock").style.position = "static"; return; }
  $("dock").style.position = ""; $("main").appendChild($("dock"));
  if (route.kind === "q") return showAsk(route.id);
  if (route.kind === "memory") return showMemory();
  showResearch(route.id);
  poll = setInterval(() => showResearch(route.id, true), 2500);
}

/* ---------------------------------------------------------------- quick answer */
async function askQuestion(question) {
  busy = true; $("sendbtn").disabled = true;
  route = { kind: "pending" }; history.pushState(null, "", location.pathname);
  $("content").classList.remove("home"); $("dock").style.position = ""; $("main").appendChild($("dock"));
  $("content").innerHTML = `<div class="view"><h2 class="q">${esc(question)}</h2>
    <div class="status-line"><span class="dot run"></span>Searching the web and reading pages…</div>
    <div class="skel" style="width:92%"></div><div class="skel" style="width:78%"></div><div class="skel" style="width:85%"></div></div>`;
  announce("Searching the web.");
  try {
    const r = await api("POST", "/ask", { question });
    history.replaceState(null, "", `#q/${r.id}`); route = { kind: "q", id: r.id };
    $("content").innerHTML = answerHtml(question, r);
    announce(`Answer ready with ${r.sources.length} sources.`);
  } catch (err) {
    $("content").innerHTML = `<div class="view"><h2 class="q">${esc(question)}</h2><div class="note bad">${esc(err.message)}</div></div>`;
  } finally { busy = false; $("sendbtn").disabled = false; loadHistory(); }
}

function answerHtml(question, r) {
  const srcs = r.sources || [];
  const cards = srcs.map((s) => `<a class="src ${s.cited ? "" : "uncited"}" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">
      <b>${esc(s.title || s.domain)}</b><span><span class="n">${s.n}</span>${esc(s.domain)}${s.cited ? "" : " · not cited"}</span></a>`).join("");
  const secs = r.timings_ms ? (r.timings_ms.total / 1000).toFixed(1) : null;
  return `<div class="view"><h2 class="q">${esc(question)}</h2>
    ${srcs.length ? `<div class="srcrow" aria-label="Sources">${cards}</div>` : `<div class="note warn">No web pages could be read for this question, so the answer is unverified.</div>`}
    <div class="prose">${md(r.answer, srcs)}
      ${(r.key_points || []).length ? `<ul>${r.key_points.map((k) => `<li>${cite(esc(k), srcs)}</li>`).join("")}</ul>` : ""}</div>
    <div class="meta"><span>Confidence: ${esc(r.confidence)}</span>${secs ? `<span>${secs} s</span>` : ""}</div>
    ${(r.follow_up_questions || []).length ? `<div class="sub">Related</div><div class="chips">${r.follow_up_questions.map((q) => `<button type="button" data-follow="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
  </div>`;
}
$("content").addEventListener("click", (e) => {
  const f = e.target.closest("[data-follow]");
  if (f) { setMode("quick"); askQuestion(f.dataset.follow); }
});

async function showAsk(id) {
  $("content").innerHTML = `<div class="view"><div class="skel" style="width:60%;height:26px"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>`;
  try {
    const a = await api("GET", `/asks/${id}`);
    $("content").innerHTML = a.status === "answered" ? answerHtml(a.question, a.result)
      : `<div class="view"><h2 class="q">${esc(a.question)}</h2><div class="note bad">This question could not be answered: ${esc(a.error || "unknown error")}</div>
         <div class="chips"><button type="button" data-follow="${esc(a.question)}">Ask again</button></div></div>`;
  } catch (err) { $("content").innerHTML = `<div class="view"><div class="note bad">${esc(err.message)}</div></div>`; }
}

/* ---------------------------------------------------------------- deep research */
function reportHtml(wf) {
  const byType = (t) => wf.tasks.filter((x) => x.agent_type === t && x.output);
  const writer = byType("writer").at(-1), reviewer = byType("reviewer").at(-1), research = byType("researcher");
  const sources = research.flatMap((t) => t.output.sources || []).map((s, i) => ({ ...s, n: i + 1 }));
  if (writer) {
    const body = String(writer.output.content || "").replace(/^\s*#{1,3}\s+(.*)\n/, (m, h) => h.trim().replace(/^\[demo\]\s*/, "") === String(writer.output.title).replace(/^\[demo\]\s*/, "").trim() ? "" : m);
    return `<article class="report"><h2 class="title">${esc(writer.output.title)}</h2><div class="prose">${md(body)}</div>
      ${reviewer ? `<p class="hint">Reviewed: ${esc(reviewer.output.summary)} (score ${esc(reviewer.output.score)}/10)</p>` : ""}</article>
      ${sources.length ? `<div class="sub">Sources</div><div class="srcrow">${sources.map((s) => `<a class="src" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer"><b>${esc(s.title || s.url)}</b><span>${esc(hostOf(s.url))}</span></a>`).join("")}</div>` : ""}`;
  }
  if (research.length) {
    const r = research.at(-1).output;
    return `<article class="report"><div class="prose"><p>${esc(r.summary)}</p><ul>${(r.key_findings || []).map((k) => `<li>${esc(k)}</li>`).join("")}</ul></div></article>`;
  }
  return "";
}

function approvalHtml(a) {  /* Part 11: who still has to approve, and which policy asked for it */
  const html = approvalBody(a);
  const votes = a.votes || [];
  if ((a.required_approvals || 1) <= 1 && !(a.policy_rules || []).length) return html;
  const line = `<p class="hint">Needs ${esc(String(a.required_approvals || 1))} different approvers`
    + (a.approver_role ? ` (role ${esc(a.approver_role)} or higher)` : "")
    + ` &middot; ${esc(String(votes.length))} so far${votes.length ? ": " + votes.map((v) => esc(v.voter)).join(", ") : ""}`
    + ((a.policy_rules || []).length ? ` &middot; policy: ${a.policy_rules.map(esc).join(", ")}` : "") + `</p>`;
  return html.replace("</h3>", "</h3>" + line);
}

function approvalBody(a) {
  const p = a.request_payload || {};
  if (p.kind === "plan_patch") {
    return `<section class="ask-card" data-approval="${esc(a.id)}" data-kind="plan_patch">
      <h3>${icon("hand")} Approve a change to the plan?</h3>
      <p>${esc(p.summary || "")} <span class="hint">Needs you because ${esc((p.why || []).join("; "))}.</span></p>
      <pre>${esc((p.diff || []).join("\n"))}</pre>
      <label class="field">Comment or reason<input class="comment"></label>
      <div class="actions" style="margin:12px 0 0"><button class="btn primary" data-d="approve">${icon("check")} Apply the change</button>
        <button class="btn danger" data-d="fail_workflow">Reject it</button></div></section>`;
  }
  if (p.kind === "loop_exhausted") {
    const reviews = Object.entries(p.reviews || {}).map(([i, r]) => `draft ${esc(i)}: score ${esc(r.score ?? "?")}`).join(" · ");
    return `<section class="ask-card" data-approval="${esc(a.id)}" data-kind="loop_exhausted">
      <h3>${icon("hand")} The drafts still don't meet the bar</h3>
      <p>${esc(p.reason || "")}. ${esc(reviews)}</p>
      <label class="field">Try more drafts (optional)<input class="extra" inputmode="numeric" placeholder="e.g. 1"></label>
      <label class="field">Comment or reason<input class="comment"></label>
      <div class="actions" style="margin:12px 0 0"><button class="btn primary" data-d="approve">${icon("check")} Continue</button>
        <button class="btn danger" data-d="fail_workflow">Stop the research</button></div></section>`;
  }
  if (p.kind === "tool_call") {
    return `<section class="ask-card" data-approval="${esc(a.id)}" data-kind="tool_call">
      <h3>${icon("hand")} Approve this action?</h3>
      <p>The ${esc(AGENT[p.agent_type] || "agent")} wants to use <strong>${esc(p.tool)}</strong>${p.reason ? `: ${esc(p.reason)}` : ""}.</p>
      ${p.warning ? `<div class="warnings">${esc(p.warning)}</div>` : ""}
      ${p.tainted ? `<div class="warnings">This step read content from the web${(p.untrusted_sources || []).length ? ` (${esc(p.untrusted_sources.slice(0, 3).join(", "))})` : ""}, so a person must check it first.</div>` : ""}
      ${(p.injection_warnings || []).length ? `<div class="warnings">Suspicious text found in a web page: ${esc(p.injection_warnings.join("; "))}. It may be trying to trick the agent.</div>` : ""}
      <label class="field">Exactly what will be sent (you can edit it)<textarea class="args" rows="6">${esc(JSON.stringify(p.arguments, null, 2))}</textarea></label>
      <div class="dup warnings" hidden></div>
      <label class="field">Comment or reason<input class="comment"></label>
      <div class="actions" style="margin:12px 0 0"><button class="btn primary" data-d="approve">${icon("check")} Approve</button>
        <button class="btn" data-d="inform_agent">Don't do it</button><button class="btn danger" data-d="fail_task">Stop this step</button></div></section>`;
  }
  return `<section class="ask-card" data-approval="${esc(a.id)}" data-kind="task">
    <h3>${icon("hand")} ${esc(p.task_name || "A step")} needs your approval</h3>
    <p>${esc(p.why_sensitive || "")} ${esc(p.task_description || "")}</p>
    <details><summary>What it will use</summary><pre>${esc(JSON.stringify(p.task_input || {}, null, 2))}</pre></details>
    <label class="field">Comment or reason<input class="comment"></label>
    <div class="actions" style="margin:12px 0 0"><button class="btn primary" data-d="approve">${icon("check")} Approve</button>
      <button class="btn" data-d="skip_task">Skip this step</button><button class="btn danger" data-d="fail_workflow">Stop the research</button></div></section>`;
}

let lastResearchHtml = "", toolCalls = {}, devTools = false;
api("GET", "/dev/chaos").then(() => { devTools = true; }).catch(() => { devTools = false; });  // 404 in production
function ganttHtml(tl) {
  const ends = tl.spans.flatMap((s) => s.attempts.map((a) => a.end_offset_s ?? a.start_offset_s ?? 0));
  const total = Math.max(1, ...ends, ...tl.entries.map((e) => e.offset_s || 0));
  const pct = (v) => Math.max(0, Math.min(100, (v / total) * 100));
  const rows = tl.spans.filter((s) => s.attempts.length).map((s) => `<div class="row"><span class="k" title="${esc(s.task_key)}">${esc(s.task_key)}</span>
    <div class="track">${s.attempts.map((a) => {
      const start = a.start_offset_s || 0, end = a.end_offset_s ?? total;
      return `<span class="seg ${esc(a.outcome)}" style="left:${pct(start)}%;width:${Math.max(0.6, pct(end) - pct(start))}%"
        title="Attempt ${a.attempt_number}: ${esc(a.outcome)}${a.error_type ? " (" + esc(a.error_type) + ")" : ""}"></span>`
        + (a.tool_calls || []).map((t) => `<span class="mk" style="left:${pct(t.offset_s || 0)}%" title="${esc(t.tool)}: ${esc(t.status)}"></span>`).join("");
    }).join("")}</div></div>`).join("");
  if (!rows) return "";
  return `<div class="sub">Timeline</div><div class="gantt" role="img" aria-label="Attempts per step over time">${rows}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>succeeded</span><span><i style="background:var(--bad)"></i>failed / crashed</span>
    <span><i style="background:var(--warn)"></i>paused / waiting for approval</span><span><i style="background:var(--accent)"></i>running</span>
    <span>| tool call</span><span>0 to ${total.toFixed(0)} s</span></div>`;
}
const TOOL_STATUS = { succeeded: ["done", "ok"], failed: ["failed", "bad"], rejected_invalid: ["invalid call", "bad"],
  awaiting_approval: ["waiting for approval", "warn"], approved: ["approved", "ok"], denied: ["denied", "bad"],
  running: ["running", ""], unknown_outcome: ["outcome unknown", "warn"] };
function argPreview(a) {
  if (!a) return "";
  const v = a.query || a.url || a.expression || a.path || (a.to && `to ${[].concat(a.to).join(", ")}`) || JSON.stringify(a);
  return String(v).slice(0, 110);
}
function toolList(rows) {
  if (!rows || !rows.length) return "";
  return `<ul class="tools" aria-label="Tool calls">${rows.map((r) => {
    const [label, cls] = TOOL_STATUS[r.status] || [r.status, ""];
    return `<li><span class="tn">${esc(r.tool)}</span><span class="ta">${esc(argPreview(r.arguments))}</span>
      <span class="badge ${cls}" title="${esc(r.error || "")}">${esc(label)}</span>
      ${r.reused ? `<span class="badge" title="Result reused from the journal; not executed again">reused</span>` : ""}
      ${r.tainted_context ? `<span class="badge warn" title="Made after reading untrusted web content">untrusted input</span>` : ""}
      ${(r.injection_warnings || []).length ? `<span class="badge bad" title="${esc(r.injection_warnings.join(", "))}">suspicious page</span>` : ""}
      ${r.duration_ms != null && !r.reused ? `<span class="ta">${r.duration_ms} ms</span>` : ""}</li>`;
  }).join("")}</ul>`;
}
async function showResearch(id, quiet = false) {
  if (!quiet) { lastResearchHtml = ""; $("content").innerHTML = `<div class="view"><div class="skel" style="width:60%;height:26px"></div><div class="skel"></div></div>`; }
  if (document.activeElement && $("content").contains(document.activeElement) && document.activeElement.matches("input, textarea")) return;
  let wf, pend, tl, versions = [];
  try {
    [wf, pend, tl, versions] = await Promise.all([api("GET", `/workflows/${id}`), api("GET", `/approvals?status=pending&workflow_id=${id}`),
      api("GET", `/workflows/${id}/timeline`).catch(() => null), api("GET", `/workflows/${id}/plan-versions`).catch(() => [])]);
    // Part 9: the tool journal of every task that has used a tool (from the timeline's markers)
    const used = (tl ? tl.spans : []).filter((s) => s.attempts.some((a) => (a.tool_calls || []).length)).map((s) => s.task_key);
    const lists = await Promise.all(used.map((k) => api("GET", `/workflows/${id}/tasks/${encodeURIComponent(k)}/tool-calls`).catch(() => [])));
    toolCalls = Object.fromEntries(used.map((k, i) => [k, lists[i]]));
  } catch (err) { $("content").innerHTML = `<div class="view"><div class="note bad">${esc(err.message)}</div></div>`; return; }
  const p = wf.progress, done = p.succeeded + p.skipped, c = wf.controls;
  const budgetPaused = wf.status === "PAUSED" && tl && tl.entries.some((e) => e.event_type === "workflow.budget_exceeded");
  const steps = wf.tasks.map((t) => {
    const cls = { RUNNING: "run", RETRYING: "run", AWAITING_APPROVAL: "wait", SUCCEEDED: "ok", FAILED: "bad" }[t.status] || "";
    return `<li><span class="dot ${cls}"></span><span>${esc(t.name)}${t.error && t.status === "FAILED" ? `<span class="err">${esc(t.error.slice(0, 180))}</span>` : ""}</span>
      <span class="who">${esc(AGENT[t.agent_type] || t.agent_type)} · ${esc(TASK_STATUS[t.status] || t.status)}${t.skip_reason ? ` (${esc(SKIP[t.skip_reason] || t.skip_reason)})` : ""}${t.iteration > 1 ? ` · draft ${t.iteration}` : ""}</span>${toolList(toolCalls[t.key])}</li>`;
  }).join("");
  const u = wf.usage || {}, eff = wf.effective_budget || {};
  const html = `<div class="view">
    <div class="rhead"><h2 class="q">${esc(wf.goal)}</h2>${pill(wf.status)}</div>
    <div class="actions">
      ${c.can_pause ? `<button class="btn" data-a="pause">Pause</button>` : ""}
      ${c.can_resume ? `<button class="btn primary" data-a="resume">Resume</button>` : ""}
      ${c.can_retry ? `<button class="btn primary" data-a="retry">Try again</button>` : ""}
      ${c.can_replan ? `<button class="btn" data-a="replan">Re-plan</button>` : ""}
      ${c.can_cancel ? `<button class="btn danger" data-a="cancel">Cancel</button>` : ""}
    </div>
    ${wf.status === "PLANNING" || (wf.status === "PENDING" && !wf.tasks.length) ? `<div class="status-line"><span class="dot run"></span>Planning the research…</div>` : ""}
    ${budgetPaused ? `<div class="note warn">Paused because it reached its usage limit. Raise the limit under “Details” and press Resume. Finished work is kept.</div>` : ""}
    ${wf.error && !["PAUSED", "COMPLETED"].includes(wf.status) ? `<div class="note bad">${esc(wf.error)}</div>` : ""}
    ${(wf.result && wf.result.failed_branches || []).length ? `<div class="note warn"><span class="badge warn">Warning</span> Finished, but ${wf.result.failed_branches.length} branch(es) failed: ${wf.result.failed_branches.map((b) => esc(b.key) + " (" + esc(b.error || b.error_type || "") + ")").join(", ")}.</div>` : ""}
    ${pend.map(approvalHtml).join("")}
    ${wf.status === "COMPLETED" ? reportHtml(wf) : ""}
    ${wf.tasks.length ? `<div class="bar" role="img" aria-label="${done} of ${p.total} steps done"><i style="width:${p.total ? (done / p.total) * 100 : 0}%"></i></div>
      <div class="meta"><span>${done} of ${p.total} steps done</span>${wf.duration_seconds ? `<span>${Math.round(wf.duration_seconds)} s</span>` : ""}</div>
      <ol class="steps">${steps}</ol>` : ""}
    <details class="more"${budgetPaused ? " open" : ""}><summary>Details</summary>
      <div class="kv"><div>AI calls<b>${u.llm_calls || 0}${eff.max_llm_calls ? " / " + eff.max_llm_calls : ""}</b></div>
        <div>Cost<b>$${Number(u.cost_usd || 0).toFixed(4)}</b></div><div>Tokens<b>${Number(u.tokens || 0).toLocaleString()}</b></div>
        <div>Tool calls<b>${u.tool_calls || 0}</b></div></div>
      <form id="budgetform" class="actions" style="align-items:end">
        <label class="field">Max AI calls<input name="max_llm_calls" inputmode="numeric" value="${eff.max_llm_calls ?? ""}"></label>
        <label class="field">Max cost ($)<input name="max_cost_usd" inputmode="decimal" value="${eff.max_cost_usd ?? ""}" placeholder="no limit"></label>
        <button class="btn" type="submit">Save limits</button></form>
      ${tl ? ganttHtml(tl) : ""}
      ${versions.length > 1 ? `<div class="sub">Plan history</div><ol class="log">${versions.map((v) => `<li><time>v${v.version}</time><span>${esc(v.trigger)} · ${esc(v.status)}${v.approved_by ? " · approved by " + esc(v.approved_by) : ""}${(v.patch && v.patch.diff || []).length ? "<br>" + v.patch.diff.map(esc).join("<br>") : ""}</span></li>`).join("")}</ol>` : ""}
      ${devTools && ["RUNNING", "AWAITING_APPROVAL"].includes(wf.status) ? `<div class="sub">Development</div>
        <p class="hint">Kill the server while the next step runs, then restart it to watch recovery. Hidden in production.</p>
        <button class="btn danger" type="button" data-chaos="1">Simulate a crash</button>` : ""}
      ${tl ? `<div class="sub">Activity</div><ol class="log">${tl.entries.slice().reverse().map((e) => `<li><time>+${e.offset_s.toFixed(1)}s</time><span>${esc(e.text)}</span></li>`).join("")}</ol>` : ""}
    </details>
  </div>`;
  if (html !== lastResearchHtml) {
    const open = $("content").querySelector("details.more")?.open;
    $("content").innerHTML = html; lastResearchHtml = html;
    if (open) $("content").querySelector("details.more").open = true;
  }
  if (["COMPLETED", "FAILED", "CANCELLED"].includes(wf.status)) clearInterval(poll);
}

async function act(fn, ok) {
  if (busy) return; busy = true;
  try { await fn(); toast(ok); lastResearchHtml = ""; await showResearch(route.id, true); loadHistory(); }
  catch (err) { toast(err.message, true); }
  finally { busy = false; }
}
$("content").addEventListener("click", (e) => {
  const a = e.target.closest("[data-a]");
  if (a && route.kind === "r") {
    const id = route.id;
    const run = {
      pause: () => api("POST", `/workflows/${id}/pause`, { actor: actor(), mode: "graceful" }),
      resume: () => api("POST", `/workflows/${id}/resume`, { actor: actor() }),
      retry: () => api("POST", `/workflows/${id}/retry`),
      replan: () => { const instructions = prompt("What should the planner change? (optional)"); if (instructions === null) throw new Error("Not re-planned."); return api("POST", `/workflows/${id}/replan`, { actor: actor(), instructions: instructions || null }); },
      cancel: () => { const reason = prompt("Cancel this research? Optional reason:"); if (reason === null) throw new Error("Not cancelled."); return api("POST", `/workflows/${id}/cancel`, { actor: actor(), reason: reason || null }); },
    }[a.dataset.a];
    if (run) act(run, { pause: "Paused", resume: "Resumed", retry: "Trying again", cancel: "Cancelled", replan: "Re-planning…" }[a.dataset.a]);
    return;
  }
  const chaosBtn = e.target.closest("[data-chaos]");
  if (chaosBtn && route.kind === "r") {
    act(async () => {
      const wf = await api("GET", `/workflows/${route.id}`);
      const t = wf.tasks.find((x) => x.status === "RUNNING") || wf.tasks.find((x) => ["READY", "PENDING"].includes(x.status));
      if (!t) throw new Error("No step is left to crash.");
      if (!confirm(`This kills the server process while "${t.name}" runs. Restart it afterwards to see recovery. Continue?`)) throw new Error("Not armed.");
      return api("POST", "/dev/chaos", { workflow_id: route.id, task_key: t.key, mode: "crash_process" });
    }, "Crash armed: the server will stop during the next run of that step.");
    return;
  }
  const d = e.target.closest("[data-d]");
  if (!d) return;
  const card = d.closest("[data-approval]");
  act(async () => {
    const aid = card.dataset.approval, comment = card.querySelector(".comment").value.trim();
    if (d.dataset.d === "approve") {
      const body = { actor: actor(), comment: comment || null };
      if (card.dataset.kind === "loop_exhausted") {
        const n = parseInt(card.querySelector(".extra").value, 10);
        if (n > 0) body.extra_iterations = n;
      }
      if (card.dataset.kind === "tool_call") {
        const dup = card.querySelector(".dup-confirm");
        if (dup) body.confirm_duplicate = dup.checked;
        try { body.arguments_overrides = JSON.parse(card.querySelector(".args").value); }
        catch { throw new Error("The details to send must be valid JSON."); }
      }
      return api("POST", `/approvals/${aid}/approve`, body);
    }
    if (!comment) throw new Error("Add a short reason first (it is recorded).");
    return api("POST", `/approvals/${aid}/reject`, { actor: actor(), reason: comment, on_reject: d.dataset.d });
  }, d.dataset.d === "approve" ? "Approved" : "Recorded");
});
/* Duplicate-send check while the approver edits the arguments (Part 10): never a silent second send. */
let dupTimer = null;
$("content").addEventListener("input", (e) => {
  const ta = e.target.closest("textarea.args");
  if (!ta) return;
  clearTimeout(dupTimer);
  dupTimer = setTimeout(async () => {
    const card = ta.closest("[data-approval]"), box = card.querySelector(".dup");
    let args; try { args = JSON.parse(ta.value); } catch { box.hidden = true; return; }
    try {
      const r = await api("POST", `/approvals/${card.dataset.approval}/check`, { arguments_overrides: args });
      box.hidden = !r.already_sent_at;
      box.innerHTML = r.already_sent_at ? `This exact message was already sent at ${esc(new Date(r.already_sent_at).toLocaleString())}.
        <label style="display:block;margin-top:6px"><input type="checkbox" class="dup-confirm"> Send it again anyway</label>` : "";
    } catch { box.hidden = true; }
  }, 400);
});
$("content").addEventListener("submit", (e) => {
  if (e.target.id !== "budgetform") return;
  e.preventDefault();
  const f = e.target;
  act(async () => {
    const budget = {};
    for (const [k, int] of [["max_llm_calls", true], ["max_cost_usd", false]]) {
      const v = f.elements[k].value.trim();
      if (!v) { budget[k] = null; continue; }
      const n = int ? parseInt(v, 10) : parseFloat(v);
      if (!(n > 0)) throw new Error("Limits must be positive numbers, or empty for no limit.");
      budget[k] = n;
    }
    await api("PATCH", `/workflows/${route.id}/budget`, { actor: actor(), budget });
  }, "Limits saved. Press Resume to continue.");
});

/* ---------------------------------------------------------------- history */
let historyItems = [];
function markCurrent() {
  document.querySelectorAll(".hitem").forEach((b) => b.setAttribute("aria-current", String(route && b.dataset.id === route.id)));
}
async function loadHistory() {
  try { historyItems = (await api("GET", "/history?limit=60")).items; }
  catch { $("history").innerHTML = `<div class="hempty">History is unavailable right now.</div>`; return; }
  const html = historyItems.length ? historyItems.map((h) => {
    const [label, cls] = STATUS[h.status] || [h.status, ""];
    return `<button type="button" class="hitem" data-kind="${h.kind === "question" ? "q" : "r"}" data-id="${esc(h.id)}">
      ${icon(h.kind === "question" ? "q" : "doc")}<span><span class="t">${esc(h.title)}</span>
      <span class="m">${h.kind === "research" ? `<span class="dot ${cls}"></span>${esc(label)} · ` : h.status === "failed" ? `<span class="dot bad"></span>Failed · ` : ""}${esc(ago(h.created_at))}</span></span></button>`;
  }).join("") : `<div class="hempty">Your questions and research will appear here.</div>`;
  if ($("history").dataset.html !== html) { $("history").innerHTML = html; $("history").dataset.html = html; markCurrent(); }
}
$("history").addEventListener("click", (e) => { const b = e.target.closest(".hitem"); if (b) go({ kind: b.dataset.kind, id: b.dataset.id }); });

setMode(mode);
go(parseHash(), false);
loadHistory();
setInterval(loadHistory, 5000);
const preset = new URLSearchParams(location.search).get("q");   // /dashboard?q=<question> asks it on load
if (preset) { setMode("quick"); askQuestion(preset); }
</script>
</body>
